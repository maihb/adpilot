# Alembic 配置。工作循环、autogenerate 的盲区、绕开盲区的约定，见
# docs/design/2026-08-19-schema-migration.md。
#
# 🔴 sqlalchemy.url 永远留空。这个文件进 git，而 DSN 里带数据库密码 —— 填上去
# 就直接撞了「任何密钥都不进仓库」。真正的连接串由 migrations/env.py 从
# get_settings().postgres_dsn 取，那一份读的是环境变量。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# 文件名带上生成时间，`ls migrations/versions` 本身就是一条时间线。只有 hash
# 的话，先后顺序得靠一个个打开文件看 down_revision 才拼得出来。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

sqlalchemy.url =

# 生成完的迁移顺手过一遍 lint 和格式化，免得它一个人让 CI 红 —— 模板产出的
# 空行数、import 分组未必正好合 ruff 的意，而那种失败离「刚生成完一份迁移」
# 这个上下文很远。先 --fix 后 format：修复会动格式，反过来就白格式化了。
# 用 module 运行方式，取的就是 .venv 里那个 ruff，与 CI 同一份。
[post_write_hooks]
hooks = ruff_lint,ruff_format
ruff_lint.type = module
ruff_lint.module = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
