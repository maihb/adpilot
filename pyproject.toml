[project]
name = "adpilot"
version = "0.1.0"
description = "Self-hosted ad performance hub for Meta and TikTok Ads, with LLM-written daily reports and anomaly diagnosis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "maihb" }]
keywords = ["advertising", "meta-ads", "tiktok-ads", "fastapi", "llm", "analytics"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis>=5.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/maihb/adpilot"
Repository = "https://github.com/maihb/adpilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adpilot"]

# ---------------------------------------------------------------------------
# 工具链配置
#
# 下面每一道门禁都同时跑在 CI 里（.github/workflows/ci.yml）。只写在文档里、
# 没有机器执行的「建议」一定会腐化，所以本仓库的规矩是：只要这件事重要，
# 它就得能让构建失败。
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",
    "RUF",
]
ignore = [
    # 注释和 docstring 用中文，全角标点（，。：、「」）会被判成「易混淆字符」。
    # 这三条规则本意是防西里尔字母冒充拉丁字母做同形攻击，对中文正文是纯误报。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["motor.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实的 PostgreSQL/MongoDB/Redis，设 RUN_INTEGRATION=1 才跑",
]
