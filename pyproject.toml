[project]
name = "adpilot"
version = "0.1.0"
description = "Self-hosted ad performance hub for Meta and TikTok Ads, with LLM-written daily reports and anomaly diagnosis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "maihb" }]
keywords = ["advertising", "meta-ads", "tiktok-ads", "fastapi", "llm", "analytics"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis>=5.2",
    "structlog>=24.4",
    "alembic>=1.19.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "import-linter>=2.13",
]

[project.urls]
Homepage = "https://github.com/maihb/adpilot"
Repository = "https://github.com/maihb/adpilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adpilot"]

# ---------------------------------------------------------------------------
# 工具链配置
#
# 下面每一道门禁都同时跑在 CI 里（.github/workflows/ci.yml）。只写在文档里、
# 没有机器执行的「建议」一定会腐化，所以本仓库的规矩是：只要这件事重要，
# 它就得能让构建失败。
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",
    "RUF",
]
ignore = [
    # 注释和 docstring 用中文，全角标点（，。：、「」）会被判成「易混淆字符」。
    # 这三条规则本意是防西里尔字母冒充拉丁字母做同形攻击，对中文正文是纯误报。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["motor.*"]
ignore_missing_imports = true

# Alembic 的迁移是由模板生成的，带不了 strict 级别的类型注解，而它们又不能改成
# 「写得好看点」—— 迁移一旦提交就是历史，只能原样留着。CI 跑的是 `mypy src
# tests`，本来就绕开了这里；这条 override 是给「有人跑 mypy .」准备的。
[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实的 PostgreSQL/MongoDB/Redis，设 RUN_INTEGRATION=1 才跑",
]

# ---------------------------------------------------------------------------
# 分层依赖契约
#
# architecture.md 的那张分层图，到这里才成为机器判定。在此之前它只是一段文字，
# 而「services/ 不许 import api/」恰恰是 review 时最容易放过去的一类违规：加一行
# import 看起来完全无害，直到 D6 的 Celery worker 调同一个服务函数时，因为拿不出
# 请求对象而炸——那时改起来已经不是删一行 import 的事了。
#
# layers 自上而下、由高到低：**高层可以 import 低层，反过来就是违约**。
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "adpilot"

[[tool.importlinter.contracts]]
name = "分层依赖只能自下而上"
type = "layers"
# containers 是 exhaustive 的前提：没有它，import-linter 不知道该拿哪个包下的
# 模块清单去比对「有没有漏列的」。
containers = ["adpilot"]
# exhaustive：adpilot 下新增的顶层模块必须在这张表里有位置，否则契约本身就红。
# 这条是刻意的 —— providers / rules / llm / tasks 都还没建，建的那天要先想清楚
# 它们摆在哪一层，而不是等依赖绕成一团之后再来考古。
exhaustive = true
layers = [
    "main",
    "api",
    "resources",
    "services",
    "schemas",
    "models",
    # 同层用 | 分隔，契约会额外验证它们**互不 import** —— providers 只认外部格式、
    # db 只管连接，两者各自独立正是 architecture.md 那张图想表达的。
    "providers | db",
    "logging",
    "config",
]
