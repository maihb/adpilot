[project]
name = "adpilot"
version = "0.1.0"
description = "Self-hosted ad performance hub for Meta and TikTok Ads, with LLM-written daily reports and anomaly diagnosis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "maihb" }]
keywords = ["advertising", "meta-ads", "tiktok-ads", "fastapi", "llm", "analytics"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis>=5.2",
    "structlog>=24.4",
    "alembic>=1.19.1",
    "python-multipart>=0.0.32",
    "celery>=5.4",
    "httpx>=0.28",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "import-linter>=2.13",
    "celery-types>=0.22",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
]

[project.urls]
Homepage = "https://github.com/maihb/adpilot"
Repository = "https://github.com/maihb/adpilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adpilot"]

# ---------------------------------------------------------------------------
# 工具链配置
#
# 下面每一道门禁都同时跑在 CI 里（.github/workflows/ci.yml）。只写在文档里、
# 没有机器执行的「建议」一定会腐化，所以本仓库的规矩是：只要这件事重要，
# 它就得能让构建失败。
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",
    "RUF",
]
ignore = [
    # 注释和 docstring 用中文，全角标点（，。：、「」）会被判成「易混淆字符」。
    # 这三条规则本意是防西里尔字母冒充拉丁字母做同形攻击，对中文正文是纯误报。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["motor.*"]
ignore_missing_imports = true

# Alembic 的迁移是由模板生成的，带不了 strict 级别的类型注解，而它们又不能改成
# 「写得好看点」—— 迁移一旦提交就是历史，只能原样留着。CI 跑的是 `mypy src
# tests`，本来就绕开了这里；这条 override 是给「有人跑 mypy .」准备的。
[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实的 PostgreSQL/MongoDB/Redis，设 RUN_INTEGRATION=1 才跑",
]

# ---------------------------------------------------------------------------
# 分层依赖契约
#
# architecture.md 的那张分层图，到这里才成为机器判定。在此之前它只是一段文字，
# 而「services/ 不许 import api/」恰恰是 review 时最容易放过去的一类违规：加一行
# import 看起来完全无害，直到 D6 的 Celery worker 调同一个服务函数时，因为拿不出
# 请求对象而炸——那时改起来已经不是删一行 import 的事了。
#
# layers 自上而下、由高到低：**高层可以 import 低层，反过来就是违约**。
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "adpilot"

[[tool.importlinter.contracts]]
name = "分层依赖只能自下而上"
type = "layers"
# containers 是 exhaustive 的前提：没有它，import-linter 不知道该拿哪个包下的
# 模块清单去比对「有没有漏列的」。
containers = ["adpilot"]
# exhaustive：adpilot 下新增的顶层模块必须在这张表里有位置，否则契约本身就红。
# 这条是刻意的 —— rules 和 llm 建立之前都先在这张表里占了位，那一步逼着人回答
# 「它摆在哪一层」，而不是等依赖绕成一团之后再来考古。
exhaustive = true
layers = [
    # seed 和 main 都是「组装 + 入口」：一个把 api 装成应用，一个把示例数据灌进库。
    # 摆在同一层而不是让 seed 更高，是因为它们之间没有依赖关系，而契约会额外验证
    # 这一点 —— main 有朝一日 import seed，就意味着 Web 进程启动时会去写示例数据，
    # 那正是这个模块最不该发生的事。
    "main | seed",
    # 同层用 | 分隔，契约会额外验证它们**互不 import**。
    #
    # api 和 tasks 是两个平级的入口：一个由 HTTP 请求驱动，一个由 RabbitMQ 里的
    # 消息驱动，共用下面的 services。它们互不 import 不是洁癖 —— tasks 认识 api
    # 就意味着 worker 里出现了请求对象，api 认识 tasks 就意味着 Web 进程要装齐
    # worker 那一侧的东西。接口投递任务走的是 `Celery.send_task` 按名字发，
    # 名字常量在 db/broker.py（两边都在它之上，够得着）。
    "api | tasks",
    "resources",
    "services",
    "schemas",
    "models",
    # providers 只认外部格式、db 只管连接（含 RabbitMQ 的接线）、notifiers 只管把
    # 消息送出去，四者各自独立正是 architecture.md 那张图想表达的。providers 是
    # 入站、notifiers 是出站，摆在同一层是因为它们都只跟外部系统打交道、都不认识
    # 业务。
    #
    # 🔴 llm 压在这一层，是设计文档「LLM 只解释不决策」那条硬边界的**机器形态**：
    # 它够不着 models / schemas / services / db，所以在 llm/ 里写一句 select(...)、
    # 把日报存进库、或者调一个业务函数去改点什么，全都会被这份契约当场拦下 ——
    # 那一层唯一能做的事是「结构化输入进去、结构化输出出来」。要改任何东西，只能
    # 由 services/ 拿着那个输出去做，而那一步是确定性代码、人能 review。
    # 代价是 llm/ 得自己定义输入输出的 Pydantic 契约（llm/contracts.py），够不着
    # schemas/ —— 那是好事：LLM 层的契约和对外 API 的契约本来就该分开演进。
    "providers | db | notifiers | llm",
    # rules 压在这么低的位置是**故意的**：它够不着 models、schemas、db，所以想在
    # 规则里写一句 select(...) 会被这份契约当场拦下。architecture.md 把 rules 和
    # services 画在同一行说的是「都是业务逻辑」，依赖方向上则是 services 调 rules、
    # rules 谁也不认识 —— 那正是「规则只依赖数据，不依赖 IO」这条规矩的机器形态。
    #
    # auth 摆在同一层出于同一个理由：token 的签发与校验是纯计算，够不着 models /
    # db，所以「在校验里查一下这个 token 撤销没有」写不出来 —— 那正是设计文档
    # 「自包含 token 不可撤销」这个决定的机器形态。邀请码需要状态（能作废、能列
    # 出来），所以它走正常的 models → services 分层，不进 auth。
    "auth | rules",
    "logging",
    "config",
]
