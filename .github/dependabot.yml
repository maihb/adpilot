# 依赖更新的自动化。
#
# 立这个文件的直接起因：CI 冒出「Node.js 20 is deprecated」的 annotation，而
# **annotation 不会让构建失败** —— 它可以一直被忽略到 GitHub 真的移除兼容层那天，
# 那时是四个 job 一起红，而且是在某次不相干的推送上红。
#
# 这正是本仓库那条规矩的反面例子：「一条规矩重要，就把它写成 lint、类型检查或
# 测试；只活在文字里的约定一定会腐化」。「记得定期看看依赖有没有过时」是典型的
# 活在文字里的约定，这里把它交给机器。
#
# **月度而不是周度**：这是个单人项目，每周三个 PR 的噪音会让人开始无视它们，而
# 一个被无视的机器人比没有机器人更糟。月度的量刚好还愿意点开看。
#
# 每个生态**合成一个 PR**（groups），理由同上：五个分散的 PR 里有一个红了，很容易
# 被当成「那个先放着」；一个 PR 红了就必须处理。
version: 2

updates:
  # 这次出问题的就是它。action 的大版本更新不频繁，但每一次都可能是「现在只是
  # 警告、将来直接失败」。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # 🔴 **只管 admin，不管 client。**
  #
  # 两个前端的依赖模型根本不同，配置得反映这个现实而不是对称处理：
  #
  # - **admin** 是普通的 Vue 3 + vite 项目，每个包各自按语义版本演进，Dependabot
  #   能正确处理。
  # - **client 的整条工具链被 uni-app 钉死。** `@dcloudio/vite-plugin-uni` 的 peer
  #   写的是 `vite: '5.2.8'` —— **精确一个版本，不是范围**；而所有 `@dcloudio/*`
  #   必须用同一个日期构建号（3.0.0-5020420260813003 这种），那根本不是语义版本。
  #   于是 vite / vitest / vue-tsc / typescript / @dcloudio/* 是一个**必须整体
  #   替换**的集合，而 Dependabot 的模型是逐包升级，两者对不上。
  #
  # 这不是推测，是连续两个 PR 撞出来的：#2 单独升 @dcloudio/types 撞上
  # uni-app 的 peer，#3 把 vite 升到 8 撞上 vite-plugin-uni 的 peer，两次都是
  # ERESOLVE，client 的 npm ci 连装都没装起来。
  #
  # **client 的升级方式是人整体来**：换一个新的 uni-app 日期版本 + 它要求的 vite
  # 版本，然后跑 make client-check。⚠️ 安全更新不受影响 —— 那是仓库级的 Dependabot
  # alerts，不看这个文件。
  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "monthly"
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: "前端依赖"

  # Python 侧走 uv.lock。CI 用 `uv sync --frozen`，所以 lock 一旦落后于上游，
  # 更新它就是唯一的入口。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "依赖"
