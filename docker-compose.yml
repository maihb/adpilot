# 本地全套环境：`docker compose up`，API 在 http://localhost:8000
#
# 凭据来自 .env（从 .env.example 拷一份）。本文件里不存在任何默认密码 ——
# 一个空密码也能起来的栈，迟早会被谁那样发到线上。

name: adpilot

services:
  api:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 主机名和端口在这里**硬写**：容器之间走服务名 + 容器内的默认端口，跟 .env
      # 里那几个 *_PORT 无关 —— 那些是宿主机侧的映射（也是本机直接跑时用的）。
      # 凭据则一律从 .env 取，缺了就让 compose 当场失败，绝不给默认值。
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 里设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?请在 .env 里设置 MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?请在 .env 里设置 MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB:-adpilot_raw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    # 跟 api 同一个镜像、同一份环境，只是换个进程跑 —— 两条链路共用 services/，
    # 镜像分家只会让「代码更新了但 worker 还是旧的」变成一类新故障。
    build:
      context: .
      target: runtime
    # 三个参数都不能省（与 Makefile 的 worker target 保持一致，有测试盯着）：
    #   -Q adpilot                       不指定就去消费默认的 celery 队列，而任务
    #                                    全投在 adpilot 上，于是一条都不处理；
    #   --without-mingle --without-gossip 这两步会建「非持久 + 非独占」队列，
    #                                    RabbitMQ 4 默认拒绝，worker 起不来。
    #                                    完整解释在 src/adpilot/db/broker.py。
    command:
      - celery
      - -A
      - adpilot.tasks.app
      - worker
      - --loglevel=info
      - -Q
      - adpilot
      - --without-mingle
      - --without-gossip
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 里设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?请在 .env 里设置 MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?请在 .env 里设置 MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB:-adpilot_raw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    # **刻意没有 healthcheck。** worker 不监听端口，唯一像样的探法是
    # `celery inspect ping`，而远程控制在 RabbitMQ 4 上根本用不了（理由见
    # db/broker.py）。剩下的招数只能探到「进程还在」—— 那件事 `restart` 已经管了，
    # 写一个只会给出「健康」这个假信号。要知道 worker 在干什么，看它的日志。
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 里设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      # postgres:18 改了约定：挂载点是 /var/lib/postgresql，不再是 17 及以前的
      # /var/lib/postgresql/data 子目录。挂错了容器能起来，但自检失败报
      # "unhealthy"，真正的原因埋在日志里。
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?请在 .env 里设置 MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?请在 .env 里设置 MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 开 appendonly 是为了重启后限流令牌桶还在；丢了的话，一瞬间每个 worker
    # 都会拿到满额度。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    # 从里程碑 D6 起用于拉报表和定时任务。现在就起着，是为了让这份 compose
    # 始终等于「整套环境」，而不是一个还在变的半成品。
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
