# 本地全套环境：`docker compose up`，API 在 http://localhost:8000
#
# 凭据来自 .env（从 .env.example 拷一份）。本文件里不存在任何默认密码 ——
# 一个空密码也能起来的栈，迟早会被谁那样发到线上。

name: adpilot

# 三个应用进程（api / worker / beat）用**同一个镜像、同一份环境**，只是入口进程
# 不同。抽成 YAML 锚点而不是抄三遍：加一个配置项就要动三处的话，漏掉的那处不会
# 报错，只会让某个进程读到默认值、连到一个你没想到的地方去。
x-app-env: &app-env
  # 主机名和端口在这里**硬写**：容器之间走服务名 + 容器内的默认端口，跟 .env
  # 里那几个 *_PORT 无关 —— 那些是宿主机侧的映射（也是本机直接跑时用的）。
  # 凭据则一律从 .env 取，缺了就让 compose 当场失败，绝不给默认值。
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  DEBUG: ${DEBUG:-true}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:?请在 .env 里设置 POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
  MONGO_HOST: mongo
  MONGO_PORT: 27017
  MONGO_USER: ${MONGO_USER:?请在 .env 里设置 MONGO_USER}
  MONGO_PASSWORD: ${MONGO_PASSWORD:?请在 .env 里设置 MONGO_PASSWORD}
  MONGO_DB: ${MONGO_DB:-adpilot_raw}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  # 告警推送。**空着是正常状态**：告警照样落库、接口照样查得到，只是不主动推。
  # 这个 URL 里带着 key，等于凭据 —— 和密码一样只从 .env 取。
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  # 认证。这三项用 `:-` 而不是上面那种 `:?`，是因为**空着不等于放行**：没有
  # AUTH_SECRET 时认证层拒绝签发也拒绝校验，服务起得来但登录不了。让一台还没
  # 填 .env 的机器能先 `docker compose up` 看见东西，比在这里卡住更符合
  # 「陌生人 clone 五分钟跑起来」。真到了 ENVIRONMENT=prod，应用自己会拒绝启动。
  AUTH_SECRET: ${AUTH_SECRET:-}
  OPERATOR_USERNAME: ${OPERATOR_USERNAME:-admin}
  OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:-}
  # LLM。全部 `:-`：**没配 LLM 是正常状态**，日报照样生成，只是那一行人话空着
  # 并标注「未生成」。API key 同理 —— 本地 Ollama / vLLM 不校验它。
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-200}
  # 留空 = 不估成本，llm_calls.estimated_cost 记 NULL（「不知道」不是「免费」）。
  LLM_INPUT_COST_PER_MTOK: ${LLM_INPUT_COST_PER_MTOK:-0}
  LLM_OUTPUT_COST_PER_MTOK: ${LLM_OUTPUT_COST_PER_MTOK:-0}
  # 平台凭据与自动拉取（D19）。全部 `:-`：**没配平台应用是正常状态** —— 那时
  # 走 fake_api provider 脱机跑，`Settings.tiktok_is_configured` 照实说「没配」。
  # 用 `:?` 会让公开仓库的 clone 者第一步就卡在一个他根本申请不到的凭据上。
  #
  # 🔴 **这六项 2026-08-26 才补进来 —— D19 当时只加了 config.py 的字段和
  # .env.example 的说明，漏了这里。** 后果是填满 .env、重启容器，值也进不了
  # 容器：所有字段都有空默认值，于是不报错、不告警，只是 TikTok 那条链路
  # 静默地当作「没配置」。加字段时这三处要一起改。
  CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:-}
  TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
  TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
  # 空 = 生产；填了就是沙盒（providers/tiktok.py 的 DEFAULT_BASE_URL 是生产地址）。
  TIKTOK_API_BASE_URL: ${TIKTOK_API_BASE_URL:-}
  # 收入类指标名，逗号分隔。**请求一个不存在的 metric 是整个请求 400**（不是那
  # 一列返回空），所以实测确认之前宁可空着。
  TIKTOK_EXTRA_METRICS: ${TIKTOK_EXTRA_METRICS:-}
  # OAuth 回调的外部基地址，必须和平台后台登记的 redirect URL 拼得上 —— 差一个
  # 字符平台就拒绝跳转，而报错只发生在平台那边，我们这里一行日志都没有。
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}

x-backends: &backends
  postgres:
    condition: service_healthy
  mongo:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

x-app-build: &app-build
  context: .
  target: runtime

services:
  api:
    build: *app-build
    depends_on: *backends
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    # 跟 api 同一个镜像，只是换个进程跑 —— 两条链路共用 services/，镜像分家只会让
    # 「代码更新了但 worker 还是旧的」变成一类新故障。
    build: *app-build
    # 三个参数都不能省（与 Makefile 的 worker target 保持一致，有测试盯着）：
    #   -Q adpilot                       不指定就去消费默认的 celery 队列，而任务
    #                                    全投在 adpilot 上，于是一条都不处理；
    #   --without-mingle --without-gossip 这两步会建「非持久 + 非独占」队列，
    #                                    RabbitMQ 4 默认拒绝，worker 起不来。
    #                                    完整解释在 src/adpilot/db/broker.py。
    command:
      - celery
      - -A
      - adpilot.tasks.app
      - worker
      - --loglevel=info
      - -Q
      - adpilot
      - --without-mingle
      - --without-gossip
    depends_on: *backends
    environment: *app-env
    # **刻意没有 healthcheck。** worker 不监听端口，唯一像样的探法是
    # `celery inspect ping`，而远程控制在 RabbitMQ 4 上根本用不了（理由见
    # db/broker.py）。剩下的招数只能探到「进程还在」—— 那件事 `restart` 已经管了，
    # 写一个只会给出「健康」这个假信号。要知道 worker 在干什么，看它的日志。
    #
    # 🔴 **必须显式 disable，光是「不写」不够。** healthcheck 在 Dockerfile 里，
    # 是镜像级的，而这三个服务共用同一个镜像 —— 不禁用的话 worker 会去探自己
    # 根本没监听的 8000 端口，`docker compose ps` 里永远挂着 unhealthy。
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    # 排期进程：只负责按点把任务投进队列，真正干活的是 worker。**两个都要起** ——
    # 只起 worker 的症状是「告警一条都不来」，而那看起来跟「一切正常」一模一样。
    #
    # 🔴 **只能有一个 beat 实例。** 起两个就是每个排期被投两遍。worker 可以横向
    # 扩，beat 不行 —— 这也是它没有和 worker 合成一个进程（`worker -B`）的理由：
    # 合了之后 worker 就再也扩不动了。
    build: *app-build
    command:
      - celery
      - -A
      - adpilot.tasks.app
      - beat
      - --loglevel=info
      # 排期状态落到容器内的临时目录。它记的是「上次什么时候投的」，是运行时状态
      # 不是数据 —— 丢了最多重复投一次，而巡检本来就是幂等的，不值得为它挂一个卷。
      - --schedule=/tmp/celerybeat-schedule
    depends_on: *backends
    environment: *app-env
    # 同 worker：镜像自带的 healthcheck 探的是 8000，beat 不监听端口。
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 里设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      # postgres:18 改了约定：挂载点是 /var/lib/postgresql，不再是 17 及以前的
      # /var/lib/postgresql/data 子目录。挂错了容器能起来，但自检失败报
      # "unhealthy"，真正的原因埋在日志里。
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?请在 .env 里设置 MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?请在 .env 里设置 MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 开 appendonly 是为了重启后限流令牌桶还在；丢了的话，一瞬间每个 worker
    # 都会拿到满额度。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    # 从里程碑 D6 起用于拉报表和定时任务。现在就起着，是为了让这份 compose
    # 始终等于「整套环境」，而不是一个还在变的半成品。
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
